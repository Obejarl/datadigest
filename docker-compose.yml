# Full stack on one machine:  docker compose up --build
# Then open http://localhost:8000

x-app: &app
  build: .
  image: datadigest:local
  environment:
    DATABASE_URL: postgresql+psycopg://datadigest:datadigest@postgres:5432/datadigest
    REDIS_URL: redis://redis:6379/0
    ACCESS_TOKEN: ${ACCESS_TOKEN:-}   # optional: export it (or put it in .env) to require a login

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datadigest
      POSTGRES_PASSWORD: datadigest
      POSTGRES_DB: datadigest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datadigest"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Append-only persistence: queued and in-flight jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Runs once and exits; api and worker wait for it to succeed.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"   # localhost only: the app has no login, do not expose it to the network
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "datadigest.worker"]
    healthcheck:
      disable: true
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ---- optional monitoring:  docker compose --profile monitoring up --build ----
  # Prometheus on http://localhost:9090, Grafana on http://localhost:3000 (dashboard "DataDigest").
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin   # local demo only; change it anywhere else
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # open the dashboard without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/datadigest.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"   # anonymous viewer + admin/admin: local demo only
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
