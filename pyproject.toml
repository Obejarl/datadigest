[project]
name = "datadigest"
version = "0.8.0"
description = "Tells you whether a CSV can be trusted: a quality score, the problems behind it, statistics in plain words and a report; an Optimize section solves planning models on the same files."
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real PostgreSQL and Redis (TEST_DATABASE_URL, TEST_REDIS_URL)",
    "spark: needs pyspark and a Java runtime (requirements-spark.txt)",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in defaults is the intended pattern, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.coverage.run]
branch = false
# spark_profile.py needs pyspark and Java, so the `spark` CI job covers it (scripts/coveragerc-spark).
omit = ["datadigest/static/*", "datadigest/core/spark_profile.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
