# Copy to k8s/secret.yaml and change the password.
# secret.yaml is in .gitignore: real credentials never go into git.
apiVersion: v1
kind: Secret
metadata:
  name: datadigest-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://datadigest:change-me@postgres:5432/datadigest
