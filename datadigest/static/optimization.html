<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimization · DataDigest</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css?v=0.7.0">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body data-page="optimization">
<header class="topbar">
  <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="32" height="32"><span class="name">DataDigest</span></a>
  <span class="ver">v0.7.0</span>
  <nav class="nav"><a href="/">Overview</a><a href="/optimize" class="active">Optimize</a><a href="/capacity">Capacity</a><a href="/docs">API docs</a></nav>
  <div class="pills" id="pills"></div>
  <a class="btn primary" href="/#upload">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    Upload CSV
  </a>
</header>

<main>
  <div class="crumbs"><a href="/optimize">Optimize</a> / <span id="crumb">…</span></div>
  <div class="phead">
    <div>
      <h1 id="title"><span class="skel" style="display:inline-block;width:300px;height:30px"></span></h1>
      <div class="chips" id="chips"></div>
    </div>
    <div class="actions" id="actions" hidden>
      <span class="actions" id="report-actions">
        <a class="btn primary" id="report-download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 20h16"/></svg>
          Download report
        </a>
        <a class="btn" id="report-open" target="_blank" rel="noopener">Open report</a>
        <a class="btn" id="result-json" target="_blank" rel="noopener">JSON</a>
      </span>
      <a class="btn" id="change-inputs">Change inputs</a>
      <a class="btn" id="dataset-link">Input data</a>
      <button class="btn danger" id="delete" type="button">Delete</button>
    </div>
  </div>

  <section class="card" id="pending" hidden>
    <h2 class="card-t">Solving</h2>
    <div class="stepper" id="stepper"></div>
    <p class="muted" id="pending-note"></p>
  </section>

  <section class="card error-card" id="failed" hidden>
    <h2 class="card-t">The model could not be solved</h2>
    <p id="error" style="margin:12px 0 16px"></p>
    <a class="btn primary" id="fix-inputs">Fix the inputs</a>
  </section>

  <section id="result" hidden></section>

  <footer>DataDigest · FastAPI · Redis · PostgreSQL · Kubernetes · HiGHS</footer>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/static/app.js?v=0.7.0"></script>
<script src="/static/optimize.js?v=0.7.0"></script>
</body>
</html>
