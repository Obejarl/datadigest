name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Unit tests with a coverage gate
        run: python -m pytest -q --cov=datadigest --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Syntax-check the dashboard JavaScript
        run: for f in datadigest/static/*.js; do node --check "$f" || exit 1; done
      - name: Cross-check Kubernetes manifests
        run: python scripts/check_manifests.py
      - name: Validate Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-filename-pattern kustomization.yaml k8s/

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: datadigest
          POSTGRES_PASSWORD: datadigest
          POSTGRES_DB: datadigest
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U datadigest" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://datadigest:datadigest@localhost:5432/datadigest
      TEST_DATABASE_URL: postgresql+psycopg://datadigest:datadigest@localhost:5432/datadigest
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrate up, down and up again
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -m integration -v

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t datadigest:ci .
      - name: Start the API on SQLite inside the image
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/dd.db datadigest:ci \
            sh -c "alembic upgrade head && uvicorn datadigest.api.main:app --host 0.0.0.0 --port 8000"
      - name: Profile a sample and solve all four optimization examples in the container
        run: sh scripts/smoke_test.sh http://localhost:8000 || (docker logs api; exit 1)

  compose:
    name: Full stack with Docker Compose (PostgreSQL, Redis, 2 workers, Prometheus, Grafana)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Alert rules are valid and every alert fires when it should (promtool)
        run: |
          for cmd in "check rules alerts.yml" "test rules alerts_test.yml"; do
            docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/rules" -w /rules               prom/prometheus:v3.1.0 $cmd
          done
      - name: Start the stack with monitoring
        run: docker compose --profile monitoring up -d --build
      - name: Smoke test through the queue
        run: sh scripts/smoke_test.sh http://localhost:8000
      - name: Check that both workers did part of the work
        run: |
          total=0; workers=0
          for id in $(docker compose ps -q worker); do
            n=$(docker logs "$id" 2>&1 | grep -cE "(dataset|optimization) .* -> done" || true)
            echo "worker $id: $n jobs"
            total=$((total + n)); workers=$((workers + 1))
            [ "$n" -ge 1 ] || { echo "a worker did nothing"; exit 1; }
          done
          echo "jobs done: $total by $workers workers"
          [ "$workers" -eq 2 ] && [ "$total" -ge 9 ]
      - name: Prometheus scrapes the API and both workers and sees the jobs
        run: |
          promql() { curl -fsS -G localhost:9090/api/v1/query --data-urlencode "query=$1" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['data']['result']; print(int(float(r[0]['value'][1])) if r else 0)"; }
          for i in $(seq 1 30); do
            up=$(promql 'sum(up)'); jobs=$(promql 'sum(datadigest_jobs_total{status="done"})')
            [ "$up" -ge 3 ] && [ "$jobs" -ge 9 ] && break; sleep 2
          done
          echo "targets up: $up, jobs done according to Prometheus: $jobs"
          [ "$up" -ge 3 ] && [ "$jobs" -ge 9 ]
      - name: Prometheus loaded the alert rules and none is firing
        run: |
          for i in $(seq 1 30); do
            n=$(curl -fsS localhost:9090/api/v1/rules | python3 -c "import json,sys; g=json.load(sys.stdin)['data']['groups']; print(sum(len(x['rules']) for x in g))" 2>/dev/null) && [ "${n:-0}" -ge 9 ] && break; sleep 2
          done
          echo "alert rules loaded: $n"; [ "$n" -ge 9 ]
          firing=$(curl -fsS localhost:9090/api/v1/alerts | python3 -c "import json,sys; print(len([a for a in json.load(sys.stdin)['data']['alerts'] if a['state']=='firing']))")
          echo "alerts firing on a healthy system: $firing"; [ "$firing" -eq 0 ]
      - name: Queued jobs survive a Redis restart (append-only persistence)
        run: |
          docker compose stop worker
          dataset=$(curl -fsS -X POST localhost:8000/api/samples/tr_survey.csv | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "queued while no worker runs: $dataset"
          docker compose restart redis
          for i in $(seq 1 30); do docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          docker compose exec -T redis redis-cli llen datadigest:jobs | tee pending.txt
          [ "$(tr -d '[:space:]' < pending.txt)" -ge 1 ]
          docker compose start worker
          for i in $(seq 1 60); do
            st=$(curl -fsS "localhost:8000/api/datasets/$dataset" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$st" = "done" ] && break; sleep 2
          done
          echo "after Redis restart and worker start: $st"; [ "$st" = "done" ]
      - name: Grafana has the data source and the dashboard
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS -u admin:admin localhost:3000/api/datasources/uid/prometheus/health \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('datasource:', d['status']); assert d['status'] == 'OK'"
          curl -fsS -u admin:admin localhost:3000/api/dashboards/uid/datadigest \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['dashboard']; print('dashboard:', d['title'], len(d['panels']), 'panels'); assert len(d['panels']) == 10"
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 80

  kubernetes:
    name: Deploy to Kubernetes (kind) and smoke-test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create a kind cluster
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 && chmod +x kind
          ./kind create cluster --name dd --wait 120s
          kubectl cluster-info
      - name: Build the image with the tag kustomize expects and load it into the cluster
        run: |
          TAG=$(sed -n 's/.*newTag: "\(.*\)".*/\1/p' k8s/kustomization.yaml)
          docker build -t "datadigest:$TAG" .
          ./kind load docker-image "datadigest:$TAG" --name dd
      - name: Apply the manifests
        run: |
          cp k8s/secret.example.yaml k8s/secret.yaml
          kubectl apply -k k8s/
      - name: Wait for the database, the migration Job and the deployments
        run: |
          kubectl -n datadigest rollout status statefulset/postgres --timeout=180s
          kubectl -n datadigest wait --for=condition=complete job/migrate --timeout=240s
          kubectl -n datadigest rollout status deploy/redis --timeout=120s
          kubectl -n datadigest rollout status deploy/api --timeout=180s
          kubectl -n datadigest rollout status deploy/worker --timeout=180s
          kubectl -n datadigest get pods -o wide
      - name: No crash loops (workers wait for Redis and PostgreSQL instead of crashing)
        run: |
          restarts=$(kubectl -n datadigest get pods -l 'app in (api,worker)' \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount}{"\n"}{end}' | awk '{s+=$1} END {print s+0}')
          echo "container restarts in api/worker pods: $restarts"
          [ "$restarts" -eq 0 ]
      - name: Smoke test through the Service
        run: |
          kubectl -n datadigest port-forward svc/api 8000:80 > port-forward.log 2>&1 &
          sh scripts/smoke_test.sh http://localhost:8000
      - name: The worker pod processed the jobs
        run: |
          kubectl -n datadigest logs deploy/worker > worker.log
          grep -E "optimization .* -> done" worker.log
          [ "$(grep -cE "optimization .* -> done" worker.log)" -ge 4 ]
      - name: The worker serves Prometheus metrics
        run: |
          kubectl -n datadigest port-forward deploy/worker 9100:9100 > pf-metrics.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS localhost:9100/metrics > worker-metrics.txt 2>/dev/null && break; sleep 1; done
          grep -E '^datadigest_jobs_total\{kind="optimization",status="done"\} [4-9]' worker-metrics.txt
      - name: Crash recovery - a job abandoned by a dead worker is retried automatically
        run: |
          kubectl -n datadigest scale deploy/worker --replicas=0
          kubectl -n datadigest wait --for=delete pod -l app=worker --timeout=120s || true  # may already be gone
          dataset=$(curl -fsS -X POST localhost:8000/api/samples/tr_survey.csv | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          # A "worker" takes the job and dies without acking it (taken at t=0, so it is already stale).
          kubectl -n datadigest exec -i deploy/api -- python - <<'PY'
          from datadigest import jobqueue
          from datadigest.config import get_settings
          s = get_settings()
          job = jobqueue.dequeue(jobqueue.connect(s.redis_url), s.queue_name, 5, now=0)
          print("taken and abandoned:", job.raw)
          PY
          curl -fsS "localhost:8000/api/datasets/$dataset" | python3 -c "import json,sys; print('before recovery:', json.load(sys.stdin)['status'])"
          kubectl -n datadigest scale deploy/worker --replicas=1
          kubectl -n datadigest rollout status deploy/worker --timeout=120s
          for i in $(seq 1 60); do
            status=$(curl -fsS "localhost:8000/api/datasets/$dataset" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = "done" ] && break; sleep 2
          done
          echo "after recovery: $status"
          kubectl -n datadigest logs deploy/worker | grep "requeued dataset:$dataset"
          [ "$status" = "done" ]
      - name: Queued jobs survive a Redis pod restart (append-only persistence)
        run: |
          kubectl -n datadigest scale deploy/worker --replicas=0
          kubectl -n datadigest wait --for=delete pod -l app=worker --timeout=120s || true
          dataset=$(curl -fsS -X POST localhost:8000/api/samples/tr_survey.csv | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          kubectl -n datadigest exec deploy/redis -- redis-cli llen datadigest:jobs
          kubectl -n datadigest delete pod -l app=redis
          kubectl -n datadigest rollout status deploy/redis --timeout=120s
          pending=$(kubectl -n datadigest exec deploy/redis -- redis-cli llen datadigest:jobs | tr -d '[:space:]')
          echo "jobs still queued after the Redis pod was replaced: $pending"
          [ "$pending" -ge 1 ]
          kubectl -n datadigest scale deploy/worker --replicas=1
          kubectl -n datadigest rollout status deploy/worker --timeout=120s
          for i in $(seq 1 60); do
            st=$(curl -fsS "localhost:8000/api/datasets/$dataset" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$st" = "done" ] && break; sleep 2
          done
          echo "final status: $st"; [ "$st" = "done" ]
      - name: Back up the database and prove the backup restores
        run: |
          kubectl -n datadigest create job --from=cronjob/postgres-backup backup-now
          kubectl -n datadigest wait --for=condition=complete job/backup-now --timeout=180s
          kubectl -n datadigest logs job/backup-now
          kubectl -n datadigest apply -f k8s/ops/restore-check-job.yaml
          kubectl -n datadigest wait --for=condition=complete job/restore-check --timeout=180s
          kubectl -n datadigest logs job/restore-check | tee restore.log
          grep "restore check passed" restore.log
          restored=$(sed -n 's/^datasets in the restored copy: //p' restore.log)
          echo "datasets restored from the backup: $restored"; [ "$restored" -ge 5 ]
      - name: Run the cleanup CronJob once
        run: |
          kubectl -n datadigest create job --from=cronjob/cleanup cleanup-now
          kubectl -n datadigest wait --for=condition=complete job/cleanup-now --timeout=120s
          kubectl -n datadigest logs job/cleanup-now
      - name: A deleted API pod is replaced and the data survives a database restart
        run: |
          kubectl -n datadigest delete pod -l app=api --wait=false
          kubectl -n datadigest delete pod postgres-0
          kubectl -n datadigest rollout status statefulset/postgres --timeout=180s
          kubectl -n datadigest rollout status deploy/api --timeout=180s
          pkill -f "port-forward" || true
          kubectl -n datadigest port-forward svc/api 8000:80 > port-forward.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8000/readyz >/dev/null 2>&1 && break; sleep 2; done
          count=$(curl -fsS localhost:8000/api/stats | python3 -c "import json,sys; print(json.load(sys.stdin)['datasets'])")
          echo "datasets after restarts: $count"
          [ "$count" -ge 5 ]
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n datadigest get all,pvc,jobs,cronjobs,hpa
          kubectl -n datadigest describe pods | tail -120
          for d in api worker; do kubectl -n datadigest logs deploy/$d --tail 60 || true; done
          kubectl -n datadigest logs job/migrate --tail 60 || true
