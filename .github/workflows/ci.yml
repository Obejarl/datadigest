name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Syntax-check the dashboard JavaScript
        run: for f in datadigest/static/*.js; do node --check "$f" || exit 1; done
      - name: Cross-check Kubernetes manifests
        run: python scripts/check_manifests.py
      - name: Validate Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-filename-pattern kustomization.yaml k8s/

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: datadigest
          POSTGRES_PASSWORD: datadigest
          POSTGRES_DB: datadigest
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U datadigest" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://datadigest:datadigest@localhost:5432/datadigest
      TEST_DATABASE_URL: postgresql+psycopg://datadigest:datadigest@localhost:5432/datadigest
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrate up, down and up again
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -m integration -v

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t datadigest:ci .
      - name: Start the API on SQLite inside the image
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/dd.db datadigest:ci \
            sh -c "alembic upgrade head && uvicorn datadigest.api.main:app --host 0.0.0.0 --port 8000"
      - name: Profile a sample and solve all four optimization examples in the container
        run: sh scripts/smoke_test.sh http://localhost:8000 || (docker logs api; exit 1)

  compose:
    name: Full stack with Docker Compose (PostgreSQL, Redis, 2 workers)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: Smoke test through the queue
        run: sh scripts/smoke_test.sh http://localhost:8000
      - name: Check that both workers did part of the work
        run: |
          total=0; workers=0
          for id in $(docker compose ps -q worker); do
            n=$(docker logs "$id" 2>&1 | grep -cE "(dataset|optimization) .* -> done" || true)
            echo "worker $id: $n jobs"
            total=$((total + n)); workers=$((workers + 1))
            [ "$n" -ge 1 ] || { echo "a worker did nothing"; exit 1; }
          done
          echo "jobs done: $total by $workers workers"
          [ "$workers" -eq 2 ] && [ "$total" -ge 9 ]
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 80

  kubernetes:
    name: Deploy to Kubernetes (kind) and smoke-test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Create a kind cluster
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 && chmod +x kind
          ./kind create cluster --name dd --wait 120s
          kubectl cluster-info
      - name: Build the image with the tag kustomize expects and load it into the cluster
        run: |
          TAG=$(sed -n 's/.*newTag: "\(.*\)".*/\1/p' k8s/kustomization.yaml)
          docker build -t "datadigest:$TAG" .
          ./kind load docker-image "datadigest:$TAG" --name dd
      - name: Apply the manifests
        run: |
          cp k8s/secret.example.yaml k8s/secret.yaml
          kubectl apply -k k8s/
      - name: Wait for the database, the migration Job and the deployments
        run: |
          kubectl -n datadigest rollout status statefulset/postgres --timeout=180s
          kubectl -n datadigest wait --for=condition=complete job/migrate --timeout=240s
          kubectl -n datadigest rollout status deploy/redis --timeout=120s
          kubectl -n datadigest rollout status deploy/api --timeout=180s
          kubectl -n datadigest rollout status deploy/worker --timeout=180s
          kubectl -n datadigest get pods -o wide
      - name: Smoke test through the Service
        run: |
          kubectl -n datadigest port-forward svc/api 8000:80 > port-forward.log 2>&1 &
          sh scripts/smoke_test.sh http://localhost:8000
      - name: The worker pod processed the jobs
        run: |
          kubectl -n datadigest logs deploy/worker > worker.log
          grep -E "optimization .* -> done" worker.log
          [ "$(grep -cE "optimization .* -> done" worker.log)" -ge 4 ]
      - name: Run the cleanup CronJob once
        run: |
          kubectl -n datadigest create job --from=cronjob/cleanup cleanup-now
          kubectl -n datadigest wait --for=condition=complete job/cleanup-now --timeout=120s
          kubectl -n datadigest logs job/cleanup-now
      - name: A deleted API pod is replaced and the data survives a database restart
        run: |
          kubectl -n datadigest delete pod -l app=api --wait=false
          kubectl -n datadigest delete pod postgres-0
          kubectl -n datadigest rollout status statefulset/postgres --timeout=180s
          kubectl -n datadigest rollout status deploy/api --timeout=180s
          pkill -f "port-forward" || true
          kubectl -n datadigest port-forward svc/api 8000:80 > port-forward.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:8000/readyz >/dev/null 2>&1 && break; sleep 2; done
          count=$(curl -fsS localhost:8000/api/stats | python3 -c "import json,sys; print(json.load(sys.stdin)['datasets'])")
          echo "datasets after restarts: $count"
          [ "$count" -ge 5 ]
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n datadigest get all,pvc,jobs,cronjobs,hpa
          kubectl -n datadigest describe pods | tail -120
          for d in api worker; do kubectl -n datadigest logs deploy/$d --tail 60 || true; done
          kubectl -n datadigest logs job/migrate --tail 60 || true
