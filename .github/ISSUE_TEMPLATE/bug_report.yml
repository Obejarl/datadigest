name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small CSV that triggers it helps a lot (remove anything private).
    validations: { required: true }
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options: [DataDigest.bat / local, Docker Compose, Kubernetes, CLI only]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: shown in the dashboard's top bar, e.g. v0.7.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
