# Spark standalone master: hands the cluster's cores out to applications (the DataDigest workers).
# It runs from the pyspark package inside the DataDigest Spark image, so the driver, the master
# and the executors all have the same Spark and Python versions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      # A Service named spark-master makes Kubernetes inject SPARK_MASTER_PORT=tcp://...,
      # which Spark reads as its own port setting and crashes on. Switch those variables off.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: master
          image: datadigest-spark
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              export SPARK_HOME="$(python -c 'import os, pyspark; print(os.path.dirname(pyspark.__file__))')"
              exec "$SPARK_HOME/bin/spark-class" org.apache.spark.deploy.master.Master \
                --host "$POD_IP" --port 7077 --webui-port 8080
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SPARK_LOG_DIR      # the package folder is read-only for the app user
              value: /tmp/spark-logs
          ports:
            - name: cluster
              containerPort: 7077
            - name: ui
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: 7077 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
spec:
  selector:
    app: spark-master
  ports:
    - name: cluster
      port: 7077
      targetPort: 7077
    - name: ui          # kubectl -n datadigest port-forward svc/spark-master 8080 to see the cluster
      port: 8080
      targetPort: 8080
