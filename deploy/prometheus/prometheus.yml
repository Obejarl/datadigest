# Scrape the API and every worker replica. Workers are found through DNS: in Compose the
# service name "worker" resolves to all of its containers, so scaling needs no config change.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s
